name: Test requireChecklist=true fails when no checklist present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'true'
        continue-on-error: true
      - name: Assert action fails when checklist is required but none exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When requireChecklist=true and no checklist is found (or API unavailable in act),
          # the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when checklist required but not found"
          else
            echo "FAIL: expected failure outcome but got $OUTCOME"
            exit 1
          fi
