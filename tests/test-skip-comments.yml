name: Test skipComments=true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with skipComments=true
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'false'
          skipComments: 'true'
        continue-on-error: true
      - name: Assert action ran with skipComments=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With skipComments=true, the action should not look at comments.
          # Under workflow_dispatch with no PR/issue, it should succeed or fail gracefully.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
