name: Test skipComments=true input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skipComments=true and requireChecklist=false
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'false'
          skipComments: 'true'
        continue-on-error: true

      - name: Assert action ran with skipComments=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With skipComments=true and requireChecklist=false, the action should succeed
          # (no checklist required, comments skipped, no unchecked items in description).
          # Under workflow_dispatch there is no PR/issue body, so no checklist to fail on.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome with skipComments=true"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
