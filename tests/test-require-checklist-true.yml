name: Test requireChecklist=true fails when no checklist present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with requireChecklist=true
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'true'
        continue-on-error: true
      - name: Assert action ran (requireChecklist=true with no PR/issue body should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no issue/PR body, so requireChecklist=true
          # should cause the action to fail (no checklist found).
          # We accept either failure (expected) or success (action skips non-PR events).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
