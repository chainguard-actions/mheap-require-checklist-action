name: Test all options combined
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with all options set
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'false'
          skipComments: 'true'
          skipDescriptionRegex: 'SKIP'
        continue-on-error: true
      - name: Assert action ran with all options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With all options set, the action should run without crashing.
          # Under workflow_dispatch with no PR/issue body, it should succeed
          # or fail gracefully (not crash with an unhandled exception).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
