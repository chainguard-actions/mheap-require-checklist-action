name: Test skipDescriptionRegex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with skipDescriptionRegex set
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          requireChecklist: 'false'
          skipDescriptionRegex: 'WIP|Draft'
        continue-on-error: true
      - name: Assert action ran with skipDescriptionRegex
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With skipDescriptionRegex set, the action should skip descriptions
          # matching the pattern. Under workflow_dispatch with no PR/issue body,
          # the action should succeed or fail gracefully.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
